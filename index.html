<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Material Board Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F4F3F0; --panel:#FFFFFF; --line:#E2DFD9; --ink:#2A2B2A; --sub:#6E6C67;
  --acc:#7A6A55; --acc-soft:#EFE9E1; --ok:#4F7A5A; --warn:#B07A2A; --ng:#A6473B;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:root{color-scheme:light}
[hidden]{display:none!important}
.compose>*,.editor>*,.exportbar>*{min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#2F302E;color:#F2EFEA;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
#aiState{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid #6d6a64;color:#cfc9bf;white-space:nowrap}
#aiState.on{border-color:#8fb59a;color:#bfe0c7}
.dlg{position:fixed;inset:0;background:rgba(30,30,28,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.dlg .card{width:min(460px,100%)}
.btn.ai{border-color:#b9ab95;background:#FBF8F3}
.btn.ai::before{content:"✦";color:var(--acc)}
.aibox{font-size:12.5px;background:#FBF8F3;border:1px solid #EADFCF;border-radius:6px;padding:10px 12px;margin-top:8px}
.aibox.stale{opacity:.6}
.busy{color:var(--acc);font-size:12px}
.brand{font-weight:700;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.brand .tag{font-size:10px;border:1px solid #9b958b;border-radius:3px;padding:1px 5px;margin-left:6px;color:#cfc9bf;vertical-align:2px}
#crumb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cfc9bf}
#saveState{font-size:12px;color:#cfc9bf;white-space:nowrap}
#saveState.err{color:#ffb3a8}
#steps{display:flex;gap:4px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:19}
#steps:empty{display:none}
.step{border:0;background:none;padding:6px 12px;border-radius:20px;color:var(--sub);cursor:pointer;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#E8E5E0;font-size:11px;margin-right:6px}
.step.on{background:var(--acc-soft);color:var(--ink);font-weight:600}
.step.on b{background:var(--acc);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--sub)}
.small{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#bdb7ad}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--ng)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.notice{background:#FBF6EC;border:1px solid #EADBBE;color:#6B5226;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
.notice.info{background:#EEF2F1;border-color:#D2DCDA;color:#36504B}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--sub);font-weight:600;background:#FAF9F7}
.tbl tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#EEECE8;color:#4c4a45;white-space:nowrap}
.chip.ok{background:#E4EFE6;color:var(--ok)}
.chip.warn{background:#F7ECD9;color:#8A5B14}
.chip.ng{background:#F5E1DE;color:var(--ng)}
.chip.smp{background:#E9E6F2;color:#55497A}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field label .req{color:var(--ng);margin-left:4px}
.field input:not([type=checkbox]):not([type=file]):not([type=color]),.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
.field textarea{min-height:84px;resize:vertical}
.field.err input,.field.err textarea{border-color:var(--ng);background:#FFF8F7}
.field .hint{font-size:11px;color:var(--sub);margin-top:3px}
.field .emsg{font-size:11px;color:var(--ng);margin-top:3px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.concept{position:relative;display:flex;flex-direction:column;gap:10px}
.concept.sel{border:2px solid var(--ink);padding:19px}
.concept .pal{display:flex;gap:8px}
.concept .pal div{flex:1;font-size:10px;color:var(--sub);text-align:center}
.concept .pal i{display:block;height:46px;border-radius:4px;border:1px solid rgba(0,0,0,.08);margin-bottom:3px}
.concept dl{margin:0;font-size:12.5px}
.concept dt{font-weight:600;color:var(--sub);font-size:11px;margin-top:6px}
.concept dd{margin:0}
.kw{display:flex;flex-wrap:wrap;gap:5px}
.selbadge{position:absolute;top:-11px;left:16px;background:var(--ink);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px}
.lib-filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:16px}
.lib-filters input,.lib-filters select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pcard.st-selected{border:2px solid var(--ok)}
.pcard.st-excluded{opacity:.55}
.pimg{aspect-ratio:4/3;background:#EFEDE9;display:grid;place-items:center;position:relative}
.pimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pimg .ph{color:#9a968e;font-size:12px;text-align:center;padding:10px}
.pimg .tagl{position:absolute;left:6px;top:6px}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pbody .mk{font-size:11px;color:var(--sub)}
.pbody .nm{font-weight:600;line-height:1.4}
.pbody code{font-size:12px;color:#4b4a46}
.pbody .meta{font-size:11.5px;color:var(--sub)}
.pfoot{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.s-selected{background:var(--ok);color:#fff}
.seg button.on.s-candidate{background:#C9B48F;color:#fff}
.seg button.on.s-excluded{background:#8a8780;color:#fff}
.compose{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.catsec{margin-bottom:28px}
.catsec h3{display:flex;align-items:center;gap:8px}
.aside{position:sticky;top:120px;display:flex;flex-direction:column;gap:14px}
.aside .card{padding:16px}
.aside ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.fit{font-size:11px;padding:6px 8px;border-radius:5px;background:#F6F5F2;color:#4b4a46;margin-top:4px}
.fit b.h{color:var(--ok)} .fit b.m{color:#8A5B14} .fit b.l{color:var(--ng)}
.cbar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:22px;flex-wrap:wrap}
.cbar .sw{display:flex;gap:4px}.cbar .sw i{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.editor{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.editor .ctrl{display:flex;flex-direction:column;gap:14px}
.editor .ctrl .card{padding:16px}
.tplpick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tplpick button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 4px;font-size:11px;cursor:pointer;line-height:1.3}
.tplpick button.on{border:2px solid var(--ink);font-weight:600}
.itemrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.itemrow:last-child{border-bottom:0}
.itemrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemrow.hid .nm{opacity:.4;text-decoration:line-through}
.ib{border:1px solid var(--line);background:#fff;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:12px;padding:0}
.itemrow select{max-width:100%;font-size:11px;padding:3px;border:1px solid var(--line);border-radius:4px}
.board-fit{position:relative;overflow:hidden;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.12);background:#fff}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:6px;background:#FAF9F7;border:1px solid var(--line)}
.checks li .ic{font-weight:700;width:18px;text-align:center}
.checks li.ok .ic{color:var(--ok)} .checks li.warn .ic{color:var(--warn)} .checks li.ng .ic{color:var(--ng)}
.exportbar{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
#modal{position:fixed;inset:0;background:rgba(30,30,28,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
#modal.on{display:flex}
#modal .card{width:min(860px,100%)}
.imgprev{width:120px;height:90px;background:#EFEDE9;border-radius:6px;display:grid;place-items:center;overflow:hidden;font-size:11px;color:#999}
.imgprev img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2F302E;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{padding:36px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}

/* ===== Board (固定サイズ・HTML/CSS描画) ===== */
.board{width:1123px;height:794px;background:var(--bbg);color:var(--btx);padding:32px 40px 22px;display:grid;column-gap:26px;row-gap:16px;position:relative;overflow:hidden;transform-origin:0 0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;line-height:1.5}
.bd-head{grid-area:head;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--bacc);padding-bottom:10px;gap:20px}
.bd-head .cn{font-size:12px;color:var(--bacc);letter-spacing:.22em;font-weight:700;text-transform:uppercase}
.bd-head h2{font-size:27px;margin:2px 0 0;letter-spacing:.02em;font-weight:700;line-height:1.25}
.bd-head .meta{font-size:11px;text-align:right;opacity:.75;white-space:nowrap}
.bd-hero{grid-area:hero;position:relative;background:#E6E3DD;overflow:hidden;border-radius:2px;min-height:0}
.bd-hero img{width:100%;height:100%;object-fit:cover;display:block}
.bd-ph{width:100%;height:100%;display:grid;place-items:center;color:#9a968e;font-size:12px;border:1px dashed #c9c4bb;min-height:60px}
.bd-imglabel{position:absolute;left:8px;bottom:8px;background:rgba(20,20,20,.68);color:#fff;font-size:10px;padding:3px 8px;border-radius:2px;letter-spacing:.04em}
.bd-concept{grid-area:concept;overflow:hidden;min-height:0}
.bd-concept .lbl,.bd-story .lbl,.bd-pal .lbl{font-size:10px;letter-spacing:.2em;color:var(--bacc);font-weight:700;margin-bottom:4px;text-transform:uppercase}
.bd-concept p{font-size:12.5px;margin:0 0 8px;line-height:1.75}
.bd-kw{display:flex;flex-wrap:wrap;gap:5px}
.bd-kw span{font-size:10.5px;border:1px solid var(--bacc);color:var(--bacc);padding:1px 8px;border-radius:10px}
.bd-pal{grid-area:pal;min-height:0}
.bd-pal .sws{display:flex;gap:12px}
.bd-pal .sws div{display:flex;align-items:center;gap:7px;font-size:10px;line-height:1.3}
.bd-pal i{width:38px;height:38px;border-radius:3px;border:1px solid rgba(0,0,0,.1);display:block}
.bd-story{grid-area:story;overflow:hidden;min-height:0}
.bd-story p{font-size:11.5px;line-height:1.75;margin:0}
.bd-mats{grid-area:mats;display:grid;gap:10px 14px;align-content:start;overflow:hidden;min-height:0}
.bd-mat{display:flex;gap:10px;align-items:flex-start;min-width:0}
.bd-mimg{width:68px;height:68px;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.bd-mimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.bd-mimg span{font-size:9px;color:#999}
.bd-minfo{min-width:0;display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.35}
.bd-minfo em{font-style:normal;font-size:9.5px;color:var(--bacc);font-weight:700;letter-spacing:.08em}
.bd-minfo b{font-size:11.5px;max-height:31px;overflow:hidden}
.bd-minfo .mk{opacity:.8}
.bd-minfo code{font-family:Consolas,"Courier New",monospace;font-size:10.5px}
.bd-badges{display:flex;gap:3px;flex-wrap:wrap;margin-top:1px}
.bd-badges span{font-size:8.5px;padding:0 5px;border-radius:2px;line-height:14px}
.bd-badges .u{background:#F3DDB5;color:#6B4710}
.bd-badges .s{background:#E2DDF0;color:#4C406F}
.bd-foot{grid-area:foot;font-size:9px;opacity:.6;display:flex;justify-content:space-between;gap:12px}
/* Template A: Editorial */
.tpl-editorial{grid-template-columns:1.05fr 1fr;grid-template-rows:auto 250px minmax(0,1fr) auto 118px auto;
  grid-template-areas:"head head" "hero mats" "concept mats" "pal mats" "story story" "foot foot"}
.tpl-editorial .bd-mats{grid-template-columns:1fr 1fr}
/* Template B: Material Grid */
.tpl-grid{grid-template-columns:270px minmax(0,1fr);grid-template-rows:auto auto auto 150px minmax(0,1fr) auto;
  grid-template-areas:"head head" "concept mats" "pal mats" "hero mats" "story mats" "foot foot"}
.tpl-grid .bd-mats{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tpl-grid .bd-mat{flex-direction:column;gap:6px}
.tpl-grid .bd-mimg{width:100%;height:118px}
.tpl-grid .bd-concept p{max-height:154px;overflow:hidden}
/* Template C: Concept Presentation */
.tpl-concept{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 280px auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "hero hero" "mats concept" "mats pal" "mats story" "foot foot"}
.tpl-concept .bd-mats{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
.tpl-concept .bd-mat{flex-direction:column;gap:4px}
.tpl-concept .bd-mimg{width:100%;height:58px}
.tpl-concept .bd-concept p{font-size:11.5px;line-height:1.6;margin-bottom:5px}
.tpl-concept .bd-story p{font-size:10.5px;line-height:1.6}

/* Template D: Flat Lay（素材サンプルの平置き。配置は商品と順番から決定的に計算） */
.tpl-flatlay{grid-template-columns:640px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "lay side" "foot foot"}
.bd-lay{grid-area:lay;position:relative;overflow:hidden;border-radius:2px;background:var(--flbg)}
.fl-bg,.fl-light{position:absolute;inset:0;background-size:100% 100%}
.fl-light{z-index:1}
.fl-chip{position:absolute;background-size:cover;background-position:center;background-repeat:no-repeat;
  box-shadow:0 1px 1px rgba(0,0,0,.22),6px 10px 18px rgba(40,30,20,.28)}
.fl-chip.contain{background-color:#fff;background-size:88% 88%;background-size:contain;background-origin:content-box;padding:5%}
.fl-chip.noimg{background:#fff;display:grid;place-items:center;font-size:10px;color:#999}
.fl-num{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.94);color:#2a2b2a;
  font-size:11px;font-weight:700;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bd-side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.tpl-flatlay .bd-hero{height:132px;flex:none}
.tpl-flatlay .bd-concept{flex:none}
.tpl-flatlay .bd-concept p{font-size:11.5px;line-height:1.6;margin-bottom:5px}
.bd-legend{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.lg-row{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;line-height:1.35}
.lg-row .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--bacc);color:var(--bacc);font-size:10px;font-weight:700;line-height:16px;text-align:center;flex:none}
.lg-row b{font-size:11px}
.lg-row code{font-family:Consolas,"Courier New",monospace;font-size:10px}
.lg-row em{font-style:normal;color:var(--bacc);font-weight:700;font-size:9.5px;margin-right:4px}

@media (max-width:1000px){
  .compose,.editor,.exportbar{grid-template-columns:1fr}
  .aside{position:static}
  .grid3{grid-template-columns:1fr}
  .lib-filters{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .form{grid-template-columns:1fr}
  .wrap{padding:20px 16px 60px}
  .top{padding:10px 16px}
  .tbl .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="go('dashboard')">AI Material Board Generator<span class="tag">MVP</span></div>
  <div id="crumb"></div>
  <span id="aiState">AI：未接続</span>
  <span id="saveState"></span>
</header>
<nav id="steps"></nav>
<main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="dlg" class="dlg" hidden></div>
<div class="toast" id="toast"></div>

// 確認ダイアログ（共有ページでは confirm/alert が使えないため画面内で表示）
function ask(msg, {ok = 'OK', cancel = 'キャンセル', danger = false} = {}){
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="card"><p style="white-space:pre-wrap;margin:0 0 18px">${esc(msg)}</p><div class="actions" style="margin-top:0">${cancel ? `<button class="btn" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn primary" data-r="1" ${danger ? 'style="background:var(--ng);border-color:var(--ng)"' : ''}>${esc(ok)}</button></div></div>`;
    d.hidden = false;
    const done = v => { d.hidden = true; d.innerHTML = ''; d.onclick = null; document.removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key === 'Escape'){ e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', key, true);
    d.onclick = e => { if (e.target === d) return done(false); const r = e.target.closest('[data-r]'); if (r) done(r.dataset.r === '1'); };
    d.querySelector('[data-r="1"]').focus();
  });
}
const note = msg => ask(msg, {cancel: ''});

function aiReady(){

const AI_OFF_CODES = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function aiErr(e){

  if (AI_OFF_CODES.includes(code)){ aiOff(); return 'Claudeの利用が許可されていないため、AI機能を止めました。ルールでの作成は引き続き使えます。'; }

// ファイル保存（共有ページでは downloads 機能、ローカルでは通常のダウンロード）
async function saveFile(name, blob){
  if (dl){
    try { await dl.save({filename: name, data: blob}); return true; }
    catch(e){ if (e && e.code !== 'declined') toast('保存できませんでした（' + (e.code || 'error') + '）'); return false; }
  }
  const url = URL.createObjectURL(blob); download(url, name); setTimeout(() => URL.revokeObjectURL(url), 5000); return true;
}

function rng(seed){
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function rgb(hex){ const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, a){ return '#' + rgb(hex).map(v => Math.max(0, Math.min(255, Math.round(v + a * 255))).toString(16).padStart(2, '0')).join(''); }
function cdist(a, b){ const x = rgb(a), y = rgb(b); return Math.sqrt(x.reduce((s, v, i) => s + (v - y[i]) ** 2, 0)); }
function lum(hex){ const [r, g, b] = rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

/* ============================================================
   サンプル商品用の素材テクスチャ（デモ専用・架空商品のみ）
   ============================================================ */
const swCache = {};
function swatchSvg(id, hex, pat){
  const k = id + hex + pat; if (swCache[k]) return swCache[k];
  const r = rng(id), W = 300, H = 300; let s = `<rect width="${W}" height="${H}" fill="${hex}"/>`;
  if (pat === 'wood'){
    for (let y = 0; y < H; y += 7) s += `<rect y="${y}" width="${W}" height="7" fill="${shade(hex, (r() - .5) * .07)}"/>`;
    for (let i = 0; i < 18; i++){ const y = r() * H; s += `<path d="M0 ${y.toFixed(1)} Q ${W/2} ${(y + (r() - .5) * 36).toFixed(1)} ${W} ${(y + (r() - .5) * 12).toFixed(1)}" stroke="${shade(hex, -.13)}" stroke-width="${(.4 + r() * 1.4).toFixed(2)}" fill="none" opacity=".55"/>`; }
    s += `<line x1="0" y1="150" x2="${W}" y2="150" stroke="${shade(hex, -.2)}" stroke-width="1" opacity=".5"/>`;
  } else if (pat === 'stone'){
    for (let i = 0; i < 320; i++) s += `<circle cx="${(r() * W).toFixed(1)}" cy="${(r() * H).toFixed(1)}" r="${(r() * 2 + .3).toFixed(2)}" fill="${shade(hex, (r() - .5) * .28)}" opacity=".65"/>`;
    for (let i = 0; i < 4; i++) s += `<path d="M${(r() * W).toFixed(0)} 0 Q ${(r() * W).toFixed(0)} 150 ${(r() * W).toFixed(0)} 300" stroke="${shade(hex, .1)}" stroke-width="1.2" fill="none" opacity=".45"/>`;
  } else if (pat === 'carpet'){
    s += `<defs><pattern id="p" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="${shade(hex, -.06)}"/><rect x="3" y="3" width="3" height="3" fill="${shade(hex, .05)}"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#p)"/>`;
    for (let i = 0; i < 40; i++) s += `<rect x="${(r() * W).toFixed(0)}" y="${(r() * H).toFixed(0)}" width="${(10 + r() * 30).toFixed(0)}" height="2" fill="${shade(hex, (r() - .5) * .2)}" opacity=".6"/>`;
    s += `<line x1="150" y1="0" x2="150" y2="300" stroke="${shade(hex, -.15)}" opacity=".5"/><line x1="0" y1="150" x2="300" y2="150" stroke="${shade(hex, -.15)}" opacity=".5"/>`;
  } else if (pat === 'fabric'){
    s += `<defs><pattern id="f" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0L4 4M4 0L0 4" stroke="${shade(hex, -.08)}" stroke-width=".7"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#f)"/>`;
    for (let i = 0; i < 60; i++) s += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * H).toFixed(0)}" r="${(r() * 1.5 + .4).toFixed(1)}" fill="${shade(hex, .08)}" opacity=".5"/>`;
  } else if (pat === 'metal'){
    s = `<defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(hex, .14)}"/><stop offset=".45" stop-color="${hex}"/><stop offset=".55" stop-color="${shade(hex, .1)}"/><stop offset="1" stop-color="${shade(hex, -.12)}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#m)"/>`;
    for (let y = 0; y < H; y += 2) s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${shade(hex, (r() - .5) * .12)}" stroke-width=".6" opacity=".5"/>`;
  } else if (pat === 'glass'){
    s = `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(hex, .06)}"/><stop offset="1" stop-color="${shade(hex, -.08)}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
    for (let x = 0; x < W; x += 12) s += `<rect x="${x}" width="6" height="${H}" fill="#fff" opacity=".18"/>`;
  } else if (pat === 'light'){
    s = `<defs><radialGradient id="l" cx=".5" cy=".62" r=".55"><stop offset="0" stop-color="#FFF4D8"/><stop offset=".35" stop-color="#E9DCC0" stop-opacity=".7"/><stop offset="1" stop-color="#3a3836" stop-opacity="0"/></radialGradient></defs><rect width="${W}" height="${H}" fill="#3a3836"/><rect width="${W}" height="${H}" fill="url(#l)"/>`;
    if (id.includes('640')) s += `<rect x="40" y="132" width="220" height="14" rx="2" fill="${hex}"/><rect x="44" y="144" width="212" height="4" fill="#FFF6DD"/><line x1="80" y1="0" x2="80" y2="132" stroke="#222" stroke-width="1.5"/><line x1="220" y1="0" x2="220" y2="132" stroke="#222" stroke-width="1.5"/>`;
    else s += `<line x1="150" y1="0" x2="150" y2="110" stroke="#222" stroke-width="2"/><path d="M110 170 Q150 100 190 170 Z" fill="${hex}"/><ellipse cx="150" cy="171" rx="40" ry="5" fill="#FFF3D0"/>`;
  } else {
    for (let i = 0; i < 120; i++) s += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * H).toFixed(0)}" r="${(r() * 3 + 1).toFixed(1)}" fill="${shade(hex, (r() - .5) * .06)}" opacity=".7"/>`;
  }
  return swCache[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`);
}
// 商品画像の解決：アップロード画像 > 画像URL > サンプル用テクスチャ。どれもなければ null（他商品の画像で代用しない）
function imgSrc(p){
  if (p.imageData) return p.imageData;
  if (safeUrl(p.imageUrl)) return safeUrl(p.imageUrl);
  if (p.isSample && p.pattern && isHex(p.colorHex)) return swatchSvg(p.id, p.colorHex, p.pattern);
  return null;
}

function genConcepts(p, variant = 0){
  const text = [p.desiredMood, p.requirements, p.usersAndScenes].join(' ');
  const score = pr => pr.match.reduce((a, w) => a + (text.includes(w) ? 1 : 0), 0);
  const req = (p.requirements || '').replace(/\s+/g, ' ').trim();
  const reqShort = req.length > 40 ? req.slice(0, 40) + '…' : req;
  return PRESETS.map((pr, i) => ({pr, s: score(pr) * 10 - i})).sort((a, b) => b.s - a.s).map(({pr}) => {
    const pal = pr.palettes[variant % pr.palettes.length];
    return {
      id: uid('concept'), projectId: p.id, presetKey: pr.key, tone: pr.tone,
      name: pr.names[variant % pr.names.length], description: pr.desc, keywords: [...pr.keywords],
      baseColor: pal[0], secondaryColor: pal[1], accentColor: pal[2],
      materialPolicy: pr.policy, recommendedCategories: [...pr.cats],
      requirementMapping: reqShort ? `「${reqShort}」に対し、${pr.answer}` : pr.answer,
      cautions: [
        '具体的な商品・品番は商品ライブラリの登録商品から選定（現時点で未確定）',
        p.constraints ? `制約「${p.constraints}」との整合を素材選定時に確認` : '避けたい素材が未入力のため要ヒアリング',
        p.budgetRange ? `予算感「${p.budgetRange}」に合わせたグレード調整が必要` : '予算感が未入力のためグレード未確定'
      ],
      status: 'candidate'
    };
  });
}

function importJSON(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let d;
    try {
      d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.projects) || !Array.isArray(d.products)) throw new Error('このアプリで書き出したJSONではありません');
    } catch(e){ note('読み込めませんでした：' + e.message); return; }
    if (!await ask(`案件${d.projects.length}件・商品${d.products.length}件を読み込みます。現在のデータは置き換わります。よろしいですか？`, {ok:'読み込む'})) return;
    db = d; ui.pid = null; save(true); go('dashboard'); toast('JSONから復元しました');
  };
  fr.readAsText(file);
}

// コンセプト3案：Claude接続時はAI、未接続または失敗時はルールで作成（どちらで作ったかを画面に明示）
async function makeConcepts(p, avoid, btn){
  let list = null, err = '';
  if (ai){
    if (btn){ btn.disabled = true; btn.textContent = 'AIが考えています…（数十秒かかります）'; }
    try { list = await aiConcepts(p, avoid); } catch(e){ err = aiErr(e); }
  }
  if (list){ p.concepts = list; p.conceptSource = 'ai'; }
  else { p.conceptVariant = (p.conceptVariant || 0) + (avoid.length ? 1 : 0); p.concepts = genConcepts(p, p.conceptVariant); p.conceptSource = 'rule'; }
  p.selectedConceptId = null; ui.editConcept = false; touch(p); go('concept');
  if (err) note(err + '\n今回はルールで3案を作成しました。');
}
async function aiConcepts(p, avoid){
  const data = {spaceType: p.spaceType, spaceArea: p.spaceArea, requirements: aiText(p.requirements, 1500), usersAndScenes: aiText(p.usersAndScenes),
    desiredMood: aiText(p.desiredMood), budgetRange: aiText(p.budgetRange, 200), constraints: aiText(p.constraints)};
  const prompt = `あなたはオフィス内装を専門とするインテリアデザイナーです。営業担当者が顧客向けのマテリアルボードを作るために、方向性がはっきり異なるデザインコンセプトを3案作ってください。
ルール:
- 商品名・メーカー名・品番・価格は書かない（商品はあとで登録済みライブラリから人が選ぶ）
- 案件データにない事実を作らない。不明点や確認が必要なことは cautions に書く
- 色は #RRGGBB 形式。baseColor は空間の大部分を占める色、secondaryColor は補助色、accentColor は締め色
- tone は "warm" / "cool" / "neutral" のいずれか
- recommendedCategories は次から3〜6個選ぶ: floor(床), wall(壁), ceiling(天井), wood(木工・家具), fabric(ファブリック), metal(金属・ガラス), lighting(照明)
- 日本語で書く（name だけは英語2〜3語）${avoid.length ? `\n- 前回の案（${avoid.join('、')}）とは別の切り口にする` : ''}
出力: 次の形のJSON配列だけを返す（3要素）。
[{"name":"Natural Warmth","description":"30〜80字","keywords":["3〜5個"],"tone":"warm","baseColor":"#D8CBB8","secondaryColor":"#8A9A8B","accentColor":"#5A4632","materialPolicy":"素材選定方針 60〜120字","recommendedCategories":["floor","wall"],"requirementMapping":"顧客要望との対応 40〜100字","cautions":["注意点・未確定事項"]}]
${DATA_NOTE}
<data>${JSON.stringify(data)}</data>`;
  const res = await ai.json(prompt, {cache: false});
  if (!Array.isArray(res) || res.length < 3) throw {code: 'invalid_json'};
  const str = (v, n) => String(v ?? '').trim().slice(0, n);
  return res.slice(0, 3).map((c, i) => {
    const fb = PRESETS[i].palettes[0];
    const cats = (Array.isArray(c.recommendedCategories) ? c.recommendedCategories : []).filter(k => CATN[k]);
    return {
      id: uid('concept'), projectId: p.id, tone: ['warm','cool','neutral'].includes(c.tone) ? c.tone : 'neutral',
      name: str(c.name, 40) || `Concept ${i + 1}`, description: str(c.description, 160),
      keywords: (Array.isArray(c.keywords) ? c.keywords : []).map(k => str(k, 20)).filter(Boolean).slice(0, 5),
      baseColor: isHex(c.baseColor) ? c.baseColor.toUpperCase() : fb[0], secondaryColor: isHex(c.secondaryColor) ? c.secondaryColor.toUpperCase() : fb[1],
      accentColor: isHex(c.accentColor) ? c.accentColor.toUpperCase() : fb[2],
      materialPolicy: str(c.materialPolicy, 240), recommendedCategories: cats.length ? [...new Set(cats)] : ['floor','wall','lighting'],
      requirementMapping: str(c.requirementMapping, 200),
      cautions: (Array.isArray(c.cautions) ? c.cautions : []).map(x => str(x, 120)).filter(Boolean).slice(0, 5),
      status: 'candidate', source: 'ai'
    };
  });
}

function fit(x, c){
  if (!c) return null;
  let s = 0, notes = [];
  if (x.tone){ if (x.tone === c.tone){ s += 2; notes.push(`${TONE[x.tone]}でコンセプトと同系統`); } else if (x.tone === 'neutral' || c.tone === 'neutral'){ s += 1; notes.push('中間的な色調で合わせやすい'); } else notes.push(`${TONE[x.tone]}のため、コンセプトとは対比的`); }
  if (isHex(x.colorHex)){
    const pal = [['基調色', c.baseColor], ['サブカラー', c.secondaryColor], ['アクセント', c.accentColor]].map(([n, h]) => [n, cdist(h, x.colorHex)]).sort((a, b) => a[1] - b[1]);
    if (pal[0][1] < 70){ s += 2; notes.push(`色が${pal[0][0]}に近い`); } else if (pal[0][1] < 140){ s += 1; notes.push(`色は${pal[0][0]}寄り`); } else notes.push('パレット外の色（差し色として要検討）');
  }
  if (!x.tone && !isHex(x.colorHex)) return {lv:'—', cls:'', text:'色情報が未登録のため判定できません'};
  const lv = s >= 3 ? ['高', 'h'] : s >= 2 ? ['中', 'm'] : ['低', 'l'];
  return {lv: lv[0], cls: lv[1], text: notes.join('。')};
}
function fitHTML(x, c, p){
  const ev = p && evalFor(p), a = ev && ev.items[x.id];
  if (a) return `<div class="fit">AI評価 <b class="${{'高':'h','中':'m','低':'l'}[a.fit] || ''}">${esc(a.fit)}</b>：${esc(a.reason)}${a.concern ? `<br><span class="muted">懸念：${esc(a.concern)}</span>` : ''}${ev.stale ? '<br><span class="muted">（評価後に構成が変わっています）</span>' : ''}</div>`;
  const f = fit(x, c); return f ? `<div class="fit">適合度 <b class="${f.cls}">${f.lv}</b>：${esc(f.text)}</div>` : '';
}
// AI評価：選択中コンセプトのものだけ有効。採用・候補の構成が変わったら「古い」と表示
const evalSig = p => Object.entries(p.items).filter(([, s]) => s !== 'excluded').map(([k, s]) => k + s).sort().join('|');
function evalFor(p){ const e = p.aiEval; if (!e || e.conceptId !== p.selectedConceptId) return null; return {...e, stale: e.sig !== evalSig(p)}; }

  const P = x => ({id: x.id, category: x.category, manufacturer: aiText(x.manufacturer, 80), productName: aiText(x.productName, 120), color: aiText(x.color, 60),
    texture: aiText(x.texture, 60), tone: x.tone || '', colorHex: x.colorHex || '', specification: aiText(x.specification, 120), verification: VS[x.verificationStatus]});
  const data = {concept: {name: c.name, description: c.description, keywords: c.keywords, tone: c.tone, baseColor: c.baseColor, secondaryColor: c.secondaryColor,
      accentColor: c.accentColor, materialPolicy: c.materialPolicy, recommendedCategories: c.recommendedCategories},
    selected: inPlay.filter(x => p.items[x.id] === 'selected').map(P), candidates: inPlay.filter(x => p.items[x.id] === 'candidate').map(P),
    otherRegistered: db.products.filter(x => !p.items[x.id]).slice(0, 60).map(x => ({id: x.id, category: x.category, productName: aiText(x.productName, 80), color: aiText(x.color, 40), tone: x.tone || ''}))};
  const prompt = `あなたはオフィス内装のインテリアデザイナーです。選んだコンセプトに対して、採用中(selected)と候補(candidates)の商品の組み合わせを評価してください。
ルール:
- 評価・提案に使ってよいのは data にある商品IDだけ。存在しない商品や商品IDを作らない
- 登録データにない仕様・性能・価格を推測で書かない

    p.aiEval = {conceptId: c.id, sig: evalSig(p), at: now(), items, summary: aiText(r.summary, 300), colorComment: aiText(r.colorComment, 240),
      missing: (Array.isArray(r.missingCategories) ? r.missingCategories : []).filter(k => CATN[k]),

}

    ${ev.alternatives.length ? `<div style="margin-top:6px"><b>代替候補（登録済み商品）</b><ul>${ev.alternatives.map(a => `<li>${esc(prod(a.replaceId).productName)} → ${esc(prod(a.withId).productName)}：${esc(a.reason)}</li>`).join('')}</ul></div>` : ''}
    ${ev.keywords.length ? `<div style="margin-top:6px"><b>検索キーワード（未登録・採用対象外）</b><ul>${ev.keywords.map(k => `<li>${CATN[k.category]}：${esc(k.keyword)}</li>`).join('')}</ul></div>` : ''}
    <div class="small muted" style="margin-top:6px">${fmt(ev.at)} 評価</div></div>

}
function setItem(id, st){ const p = cur(); if (st) p.items[id] = st; else delete p.items[id]; touch(p); render(); }
V.compose = p => {

function altSuggest(p, c){
  const adopted = db.products.filter(x => p.items[x.id] === 'selected');

    const better = db.products.filter(x => x.category === a.category && x.id !== a.id && p.items[x.id] !== 'selected' && (fit(x, c) || {}).lv === '高');
    if (better.length) alts.push(`${a.productName} → ${better.map(b => b.productName).join('／')}`);
  });
  return alts.length ? `<div class="small" style="margin-top:8px"><b>代替候補（登録済み商品から）</b><ul>${alts.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : '';

/* 平置きコラージュ：画像生成AIは使わず、商品画像を決まった規則で重ねて配置する。

const FL_W = 640, FL_H = 616;
const FL_SLOTS = [ // [x, y, w, h, 回転]（% 単位）。前ほど大きく、後ろほど上に重なる
  [6, 4, 50, 60, -2], [44, 14, 48, 56, 1.5], [20, 46, 36, 40, 3], [58, 54, 32, 38, -3], [2, 36, 22, 48, -1.5], [70, 2, 24, 24, 4],

  for (let i = 0; i < 700; i++) s += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * H).toFixed(0)}" r="${(r() * 2.4 + .4).toFixed(1)}" fill="${shade(hex, (r() - .5) * .07)}" opacity=".8"/>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`);
}
const FL_LIGHT = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686"><defs><filter id="b"><feGaussianBlur stdDeviation="14"/></filter></defs><g filter="url(#b)"><polygon points="-40,120 120,-40 220,-40 -40,240" fill="#fff" opacity=".42"/><polygon points="-40,330 330,-40 380,-40 -40,390" fill="#fff" opacity=".3"/><polygon points="420,726 680,470 680,560 520,726" fill="#000" opacity=".06"/></g></svg>`);
function flatLay(items, c, W = FL_W, H = FL_H, nums = true, style = ""){
  const list = items.map((x, i) => ({x, num: i + 1})).slice(0, FL_SLOTS.length)
    .sort((a, b) => (FL_RANK[a.x.category] ?? 9) - (FL_RANK[b.x.category] ?? 9) || a.num - b.num);
  const slots = list.map((it, i) => {
    const [px, py, pw, ph, rot] = FL_SLOTS[i];
    let s = {x: px / 100 * W, y: py / 100 * H, w: pw / 100 * W, h: ph / 100 * H, r: rot};
    const a = it.x.imageData && it.x.imageAspect; // 実商品の写真は元の縦横比に合わせる（トリミングしない）
    if (a){ const area = s.w * s.h, cx = s.x + s.w / 2, cy = s.y + s.h / 2; s.w = Math.sqrt(area * a); s.h = area / s.w; s.x = cx - s.w / 2; s.y = cy - s.h / 2; }

  const covered = (i, px, py) => slots.some((o, j) => j > i && px > o.x - 14 && px < o.x + o.w + 14 && py > o.y - 14 && py < o.y + o.h + 14);

  }).join('');
  return `<div class="bd-lay" style="--flbg:${bgHex};${style}"><div class="fl-bg" style="background-image:url(&quot;${flBackground(bgHex, W, H)}&quot;)"></div><div class="fl-light" style="background-image:url(&quot;${FL_LIGHT}&quot;)"></div>${chips}</div>`;

  add(items.length ? 'ok' : 'ng', items.length ? `商品${items.length}点の商品名・メーカー・品番は、商品ライブラリの登録データをそのまま表示しています` : '採用商品がありません');
  const unv = items.filter(x => x.verificationStatus !== 'verified');
  add(unv.length ? 'warn' : 'ok', unv.length ? `未確認の商品が${unv.length}点あり、ボードに「未確認」ラベルを表示しています：${unv.map(x => x.productName).join('、')}` : 'すべての商品が確認済みです');
  const noCode = items.filter(x => !x.productCode);
  if (noCode.length) add('warn', `品番が未登録の商品：${noCode.map(x => x.productName).join('、')}（ボードには「品番 未確認」と表示）`);
  const urls = items.filter(x => safeUrl(x.productUrl));
  add(urls.length === items.length && items.length ? 'ok' : 'warn', `商品ページURL：${urls.length}/${items.length}点登録済み${urls.length ? '（' + urls.map(x => `<a href="${esc(x.productUrl)}" target="_blank" rel="noopener noreferrer">${esc(x.productName)}</a>`).join('、') + '）' : ''}`);
  add(b.heroImage ? 'ok' : 'warn', b.heroImage ? 'メインビジュアルに「イメージ画像」表示があります' : 'メインビジュアルが未設定です');
  const ng = items.filter(x => x.imagePermissionStatus === 'forbidden'), internal = items.filter(x => x.imagePermissionStatus === 'internal'), unk = items.filter(x => x.imagePermissionStatus === 'unverified');
  if (ng.length) add('ng', `画像「利用不可」の商品があります：${ng.map(x => x.productName).join('、')}。差し替えるか非表示にしてください`);
  if (internal.length) add('warn', `「社内検証のみ」の画像が${internal.length}点あります。顧客向けの資料には使えません`);
  if (unk.length) add('warn', `画像の利用条件が未確認：${unk.map(x => x.productName).join('、')}`);
  if (!ng.length && !internal.length && !unk.length && items.length) add('ok', 'すべての商品画像の利用許諾を確認済みです');
  const noImg = items.filter(x => !imgSrc(x));
  if (noImg.length) add('warn', `画像のない商品：${noImg.map(x => x.productName).join('、')}（「画像なし」と表示）`);
  const samples = items.filter(x => x.isSample);
  if (samples.length) add('warn', `サンプル／架空データが${samples.length}点含まれています。実際の提案には実在商品へ差し替えてください`);
  const over = [...document.querySelectorAll('#boardPrev .bd-chk')].filter(el => el.scrollHeight > el.clientHeight + 2);
  if (b.templateId === 'flatlay' && items.length > FL_SLOTS.length) add('warn', `平置きに並べられるのは${FL_SLOTS.length}点までです。${items.length - FL_SLOTS.length}点は一覧にだけ表示されます`);
  add(over.length ? 'ng' : 'ok', over.length ? `文字や商品がはみ出しています（${over.map(el => el.classList.contains('bd-mats') || el.classList.contains('bd-legend') ? '商品一覧' : el.classList.contains('bd-story') ? 'デザインストーリー' : 'コンセプト説明').join('・')}）。文章を短くするか、商品を減らす・テンプレートを変えてください` : '文字切れ・レイアウト崩れは検出されませんでした');
  $('#checks').innerHTML = out.map(([lv, t]) => `<li class="${lv}"><span class="ic">${lv === 'ok' ? '✓' : lv === 'warn' ? '!' : '×'}</span><span>${t.includes('<a ') ? t : esc(t)}</span></li>`).join('');
  return out;
}
// 平置きコラージュを書き出し用に1枚の画像へ焼き込む（回転した素材の影を html2canvas が正しく描けないため）
async function bakeFlatLay(root, S, replace = true){
  const lay = root.querySelector('.bd-lay'); if (!lay) return;
  const W = lay.clientWidth, H = lay.clientHeight, cv = document.createElement('canvas');
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  const load = src => new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const urlOf = el => { const m = /url\("?(.*?)"?\)$/.exec(el.style.backgroundImage || ''); return m ? m[1] : ''; };
  ctx.fillStyle = getComputedStyle(lay).backgroundColor; ctx.fillRect(0, 0, W, H);
  for (const sel of ['.fl-bg', '.fl-light']){ const im = await load(urlOf(lay.querySelector(sel))); if (im) ctx.drawImage(im, 0, 0, W, H); }
  for (const ch of lay.querySelectorAll('.fl-chip')){
    const x = parseFloat(ch.style.left), y = parseFloat(ch.style.top), w = parseFloat(ch.style.width), h = parseFloat(ch.style.height);
    const rot = parseFloat((/rotate\((-?[\d.]+)deg\)/.exec(ch.style.transform) || [0, 0])[1]) * Math.PI / 180;
    const im = await load(urlOf(ch)), contain = ch.classList.contains('contain');
    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot);
    ctx.shadowColor = 'rgba(40,30,20,.30)'; ctx.shadowBlur = 18 * S; ctx.shadowOffsetX = 6 * S; ctx.shadowOffsetY = 10 * S;
    ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip();
    if (im){
      const r = contain ? Math.min(w * .9 / im.width, h * .9 / im.height) : Math.max(w / im.width, h / im.height);
      ctx.drawImage(im, -im.width * r / 2, -im.height * r / 2, im.width * r, im.height * r);
    } else { ctx.fillStyle = '#999'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('画像なし', 0, 4); }
    const n = ch.querySelector('.fl-num');
    if (n){
      const nx = parseFloat(n.style.left) + 10 - w / 2, ny = parseFloat(n.style.top) + 10 - h / 2;
      ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 3 * S; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 1 * S;
      ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.beginPath(); ctx.arc(nx, ny, 10, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.fillStyle = '#2a2b2a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.textContent, nx, ny + .5);
    }
    ctx.restore();
  }
  if (replace) lay.innerHTML = `<img src="${cv.toDataURL('image/png')}" alt="" style="width:100%;height:100%;display:block">`;
  return cv;
}
// 平置きコラージュだけを正方形で書き出す（画像生成AIは使わない）
const SQ = 1080;
async function squareCanvas(p, nums, S = 2){
  const items = boardItems(p).filter(x => !p.board.hidden.includes(x.id));
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-20000px;top:0;width:${SQ}px;height:${SQ}px`;
  host.innerHTML = flatLay(items, concept(p), SQ, SQ, nums, `width:${SQ}px;height:${SQ}px`);
  document.body.appendChild(host);
  try { return await bakeFlatLay(host, S, false); } finally { host.remove(); }
}
async function exportSquare(){
  const p = cur(), msg = $('#sqMsg');
  const items = boardItems(p).filter(x => !p.board.hidden.includes(x.id));
  if (!items.length){ msg.textContent = '採用商品がありません。'; return; }
  const ng = items.filter(x => x.imagePermissionStatus === 'forbidden');
  if (ng.length){ msg.innerHTML = `<span style="color:var(--ng)">画像「利用不可」の商品があります（${esc(ng.map(x => x.productName).join('、'))}）。ボード編集で非表示にするか差し替えてください。</span>`; return; }
  const limited = items.filter(x => ['internal', 'unverified'].includes(x.imagePermissionStatus) && !x.isSample);
  if (limited.length && !await ask(`画像の利用条件が「社内検証のみ」または「未確認」の商品が${limited.length}点あります。顧客向けの資料には使わないでください。書き出しますか？`, {ok:'書き出す'})) return;
  msg.textContent = '書き出し中…';
  try {
    const cv = await squareCanvas(p, $('#sqNums').checked);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const name = `${(p.board.title || p.name || 'material-board').replace(/[\\/:*?"<>|]/g, '_')}_flatlay.png`;
    msg.textContent = await saveFile(name, blob) ? `書き出しました（${cv.width}×${cv.height}px）` : '保存は取り消されました。';
  } catch(e){ msg.textContent = '書き出しに失敗しました（' + (e && e.message || e) + '）'; }
}
async function exportBoard(kind){
  const p = cur(), msg = $('#expMsg');
  const res = runChecks();
  if (!$('#ackCheck').checked){ msg.innerHTML = '<span style="color:var(--ng)">「出力前チェックの内容を確認しました」にチェックを入れてください。</span>'; return; }
  if (res.some(r => r[0] === 'ng') && !await ask('出力前チェックに「×」の項目があります。このまま出力しますか？', {ok:'出力する'})) return;
  if (typeof html2canvas === 'undefined' || (kind === 'pdf' && !window.jspdf)){ msg.textContent = '出力用ライブラリを読み込めませんでした。ネット接続を確認してから、ページを開き直してください。'; return; }
  msg.textContent = '書き出し中…';
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-20000px;top:0;width:${BW}px;height:${BH}px`;
  host.innerHTML = boardHTML(p); document.body.appendChild(host);
  try {
    await bakeFlatLay(host, 2.5);
    await Promise.all([...host.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const canvas = await html2canvas(host.firstElementChild, {scale: 2.5, useCORS: true, backgroundColor: null, logging: false});
    const name = `${(p.board.title || p.name || 'material-board').replace(/[\\/:*?"<>|]/g, '_')}_v${p.board.version}`;
    let blob;
    if (kind === 'png') blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    else {
      const pdf = new window.jspdf.jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210); blob = pdf.output('blob');
    }
    host.remove();
    if (!await saveFile(`${name}.${kind}`, blob)){ msg.textContent = '保存は取り消されました。'; return; }
    p.exportedAt = now(); p.board.version += 1; touch(p);
    msg.textContent = `${kind.toUpperCase()}を書き出しました（次回の版数：v${p.board.version}）`;
  } catch(e){
    msg.textContent = '書き出しに失敗しました。外部URLの画像は配信元の設定で書き出せない場合があります。画像をアップロード登録に切り替えてください。（' + e.message + '）';
  } finally { host.remove(); }
}

function showModal(html){ const m = $('#modal'); m.innerHTML = html; m.classList.add('on'); }
function closeModal(){ const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function readImage(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', .86)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
